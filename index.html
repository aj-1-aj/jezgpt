<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JezGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a parody chatbot window, one column, card palette (cream, gold, navy) */
:root{
  --bg:#f6efd8; --panel:#fffbee; --fg:#1c2540; --muted:#6b6650; --gold:#c9a227; --gold-soft:#efdca2;
  --bubble:#1c2540; --bubble-fg:#fdf8e8; --line:#e2d29c; --heart:#d7263d;
  --display:"Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12172a; --panel:#1a2138; --fg:#f3ead0; --muted:#a9a387; --gold:#e3bf4c; --gold-soft:#3a3624;
  --bubble:#e3bf4c; --bubble-fg:#12172a; --line:#2e3654; --heart:#ff5a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12172a; --panel:#1a2138; --fg:#f3ead0; --muted:#a9a387; --gold:#e3bf4c; --gold-soft:#3a3624;
  --bubble:#e3bf4c; --bubble-fg:#12172a; --line:#2e3654; --heart:#ff5a6e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  margin:0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.5px}
.brand h1 span{color:var(--gold)}
.model{font-size:13px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel)}
.model b{color:var(--fg)}
.chat{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 0 0 5px var(--bg), 0 0 0 6px var(--line)}
.hero{display:flex;gap:18px;align-items:center}
.hero svg{width:96px;height:96px;flex:none}
.hero p{margin:0;font-family:var(--display);font-weight:500;font-size:22px;line-height:1.25;text-wrap:balance}
.hero p strong{font-weight:800}
.msg{display:flex;gap:10px;align-items:flex-end;min-width:0}
.msg.you{justify-content:flex-end}
.bubble{max-width:85%;padding:10px 14px;border-radius:16px;min-width:0;overflow-wrap:anywhere}
.you .bubble{background:var(--bubble);color:var(--bubble-fg);border-bottom-right-radius:4px}
.jez .bubble{background:var(--gold-soft);border-bottom-left-radius:4px}
.jez .av{width:28px;height:28px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
form{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;background:var(--bg)}
form:focus-within{border-color:var(--gold)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;outline:none;padding:8px 0}
#send{flex:none;width:40px;height:40px;border-radius:10px;border:0;background:var(--bubble);color:var(--bubble-fg);font-size:20px;cursor:pointer}
button:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.contact{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:16px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.addr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addr code{font-family:var(--mono);font-size:17px;user-select:all;background:var(--bg);border:1px solid var(--line);padding:8px 12px;border-radius:10px;overflow-wrap:anywhere;min-width:0}
.btn{font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--fg);color:var(--bg)}
.hmu{text-align:center;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em}
.hmu span{color:var(--heart)}
.fine{text-align:center;font-size:12px;color:var(--muted);margin:0}
@media (max-width:420px){.hero svg{width:72px;height:72px}.hero p{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.msg.new{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.4}}}
</style>
<style>
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input,.field textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
#mailform{display:flex;flex-direction:column;align-items:stretch;gap:14px;border:0;padding:0;background:none;border-radius:0}
#send.send{width:auto;height:auto;align-self:flex-end;font:inherit;font-weight:800;font-size:16px;padding:12px 22px;border-radius:12px;border:0;background:var(--bubble);color:var(--bubble-fg);cursor:pointer}
#send.send:disabled{opacity:.6;cursor:wait}
.hp{position:absolute;left:-9999px}
.status{margin:0;padding:12px 14px;border-radius:12px;font-weight:500}
.status.ok{background:var(--gold-soft)}
.status.err{border:1.5px solid var(--heart);color:var(--fg)}
.to{font-size:14px;color:var(--muted)}
.to code{font-family:var(--mono);color:var(--fg)}
</style>
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo" viewBox="0 0 64 64">
      <path d="M32 4C16.5 4 4 15.2 4 29c0 7.3 3.5 13.9 9.1 18.5L10 60l13.3-7.4c2.8.8 5.7 1.2 8.7 1.2 15.5 0 28-11.2 28-25S47.5 4 32 4z" fill="#1c2540"/>
      <path d="M32 9C18.6 9 9 18.3 9 29s9.6 20 23 20 23-9.3 23-20S45.4 9 32 9z" fill="none" stroke="#c9a227" stroke-width="2"/>
      <path d="M36 17v15.5c0 5-3 8-7.8 8-3.4 0-6-1.7-7.2-4.3l4-2.2c.7 1.3 1.8 2.1 3.1 2.1 2 0 3-1.3 3-3.8V17z" fill="#fdf8e8"/>
      <path d="M45 15l1.4 3.6L50 20l-3.6 1.4L45 25l-1.4-3.6L40 20l3.6-1.4z" fill="#e8c75a"/>
    </symbol>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff27a"/><stop offset=".55" stop-color="#ffd21f"/><stop offset="1" stop-color="#e9a400"/>
    </radialGradient>
    <clipPath id="mouth"><path d="M20 52 Q50 92 80 52 Q50 66 20 52Z"/></clipPath>
    <symbol id="smiley" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="47" fill="url(#face)" stroke="#d99a00" stroke-width="1.5"/>
      <ellipse cx="36" cy="36" rx="4.2" ry="7" fill="#3b2a12"/>
      <ellipse cx="64" cy="36" rx="4.2" ry="7" fill="#3b2a12"/>
      <path d="M20 52 Q50 92 80 52 Q50 66 20 52Z" fill="#fff"/>
      <g stroke="#9a9a9a" stroke-width="1" clip-path="url(#mouth)">
        <path d="M22 54.5 Q50 70 78 54.5" fill="none"/>
        <line x1="30" y1="57" x2="31" y2="70"/><line x1="38" y1="60" x2="38.5" y2="76"/>
        <line x1="46" y1="61.5" x2="46" y2="79"/><line x1="54" y1="61.5" x2="54" y2="79"/>
        <line x1="62" y1="60" x2="61.5" y2="76"/><line x1="70" y1="57" x2="69" y2="70"/>
      </g>
      <path d="M20 52 Q50 92 80 52 Q50 66 20 52Z" fill="none" stroke="#3b2a12" stroke-width="2.4" stroke-linejoin="round"/>
      <ellipse cx="34" cy="20" rx="14" ry="6" fill="#fff" opacity=".35"/>
    </symbol>
  </defs>
</svg>
<div class="wrap">
  <header>
    <div class="brand"><svg role="img" aria-label="JezGPT logo"><use href="#logo"/></svg><h1>Jez<span>GPT</span></h1></div>
    <div class="model">Model: <b>Jez-1 Bored</b></div>
  </header>

  <main class="chat">
    <div class="hero">
      <svg role="img" aria-label="Grinning smiley"><use href="#smiley"/></svg>
      <p>Hey its me<br><strong>Its Jeremy!</strong><br>Ask me anything</p>
    </div>

    <div class="chips" id="chips">
      <button class="chip" type="button">What's 9 + 10?</button>
      <button class="chip" type="button">Are you bored right now?</button>
      <button class="chip" type="button">Help with my homework</button>
    </div>

    <form id="mailform" novalidate>
      <div class="field">
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" required maxlength="120" placeholder="What's this about?">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required maxlength="3000" placeholder="Ask me anything…"></textarea>
      </div>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="to">Goes straight to <code>27Chenj@cgs.vic.edu.au</code></div>
      <button class="send" id="send" type="submit">Send ↑</button>
      <p class="status" id="status" role="status" hidden></p>
    </form>
  </main>

  <div class="hmu">HMU IM BORED <span>❤︎</span></div>
  <p class="fine">JezGPT can make mistakes. Check important info with a teacher.</p>
</div>

<script>
const TO = "27Chenj@cgs.vic.edu.au";

const form = document.getElementById("mailform");
const status = document.getElementById("status");
const sendBtn = document.getElementById("send");
const subject = document.getElementById("subject");

function show(kind, text){ status.className = "status " + kind; status.textContent = text; status.hidden = false; }

document.getElementById("chips").addEventListener("click", e => {
  if (e.target.matches(".chip")) { subject.value = e.target.textContent; document.getElementById("message").focus(); }
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const data = new FormData(form);
  const email = data.get("email").trim(), subj = data.get("subject").trim(), msg = data.get("message").trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show("err", "Enter a valid email so Jeremy can reply.");
  if (!subj) return show("err", "Add a subject.");
  if (!msg) return show("err", "Write a message first.");
  if (data.get("_honey")) return;
  sendBtn.disabled = true; sendBtn.textContent = "Sending…"; status.hidden = true;
  try {
    const res = await fetch("https://formsubmit.co/ajax/" + TO, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ email, _replyto: email, _subject: "JezGPT: " + subj, subject: subj, message: msg, _template: "box" })
    });
    const j = await res.json().catch(() => ({}));
    if (res.ok && String(j.success) === "true") { form.reset(); show("ok", "Sent! Jeremy will reply to " + email + " when he's bored (soon)."); }
    else show("err", j.message || "That didn't send. Try again in a minute.");
  } catch { show("err", "Couldn't reach the server. Check your connection and try again."); }
  sendBtn.disabled = false; sendBtn.textContent = "Send ↑";
});
</script>
</body></html>
